name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + artifact verification (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Offline-by-design: tests mock every HTTP call and the judge key is empty,
      # so no repository secret / network access is required.
      PYTHONPATH: src
      DEEPSEEK_API_KEY: ""
      CITEGUARD_API_SLEEP: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # pytest + httpx (FastAPI TestClient) are test-only dependencies.
          python -m pip install "pytest>=8" "httpx>=0.27"

      - name: Show environment
        run: |
          python --version
          python -m pip --version
          python -c "import fastapi, httpx, pytest; print('fastapi', fastapi.__version__, '| httpx', httpx.__version__, '| pytest', pytest.__version__)"

      - name: Run pytest
        run: pytest tests -q

      - name: Verify CiteBench-CN artifacts
        run: PYTHONPATH=src python scripts/verify_artifacts.py

      - name: Check deliverable packaging (dry run, no upload)
        run: PYTHONPATH=src python scripts/package_deliverable.py --quiet

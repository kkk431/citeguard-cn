site_name: CiteGuard-CN 文档
site_description: 中文引文核验工作台：真实性 / 引用支持度 / GB/T 7714-2025 格式
site_author: CiteGuard-CN
repo_url: https://github.com/kkk431/citeguard-cn
docs_dir: docs
site_dir: site
extra_css:
  - stylesheets/extra.css

theme:
  name: readthedocs
  locale: zh_CN
  navigation_depth: 2
nav:
  - 公开榜单: leaderboard.md
  - CiteBench-CN v2: citebench_v2.md
  - 首页: index.md
  - 状态总表 v1.3.4: status_v1.3.4.md
  - 部署与运行: deployment.md
  - API 与 Python SDK: api.md
  - 生态集成: ecosystem.md
  - 存储与索引: storage.md
  - 评测与证据: experiments.md
  - 引用健康画像: health.md
  - 图表层: charts.md
  - Live 划句核验: live.md
  - CiteMap 证据地图: evidence_map.md
  - 长列表与检查明细: ui_patterns.md
  - 修复闭环: repair_loop.md
  - 批量聚合: aggregate.md
  - 撤稿与勘误检查: retraction.md
  - 替换建议: replacement.md
  - 证据矩阵: evidence_matrix.md
  - 题录库标签: library_tags.md
  - 证据索引: evidence_index.md
  - 性能: performance.md
  - 数据集: dataset_release.md
  - 开源模型: models.md
  - 模型对比矩阵: model_matrix.md
  - 许可与依赖: licenses.md
  - 路线图: plan_national.md
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: ignore
